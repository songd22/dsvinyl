<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember — dsvinyl draft</title>
<style>
  :root {
    --S: min(63vh, 42vw);                 /* cover size */
    --tint: rgb(214 140 70);              /* vinyl colour, from the cover */
    --wash: rgb(120 70 40);               /* background colour wash, from the cover */
    --ink: rgb(255 244 230);
    --font: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  }
  @media (orientation: portrait) { :root { --S: min(70vw, 43vh); } }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120c08; color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body.idle { cursor: none; }

  /* Ambience: the cover itself, blown up and blurred, under a golden-evening glow. */
  .bg { position: fixed; inset: 0; overflow: hidden; }
  .bg div {
    position: absolute; inset: -20%;
    background: center / cover no-repeat;
    filter: blur(90px) saturate(1.2) brightness(.5);
    opacity: 0; transition: opacity 1.6s ease;
  }
  .bg div.on { opacity: 1; }
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 75% 70% at 12% 105%, rgb(255 168 80 / .38), transparent 70%),
      radial-gradient(ellipse 60% 55% at 92% -5%, color-mix(in srgb, var(--wash) 40%, transparent), transparent 70%),
      linear-gradient(180deg, rgb(18 10 5 / .15), rgb(18 10 5 / .55));
    transition: opacity 2s ease;
  }
  body.paused .glow { opacity: .7; }
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--S) * .09);
  }

  /* Cover + disc pair. The disc sits behind the cover and slides out of it. */
  .pair { position: relative; width: calc(var(--S) * 1.53); height: var(--S); --out: .55; }
  body.paused .pair { --out: .40; }
  .pair.swap { --out: .02; }
  @media (orientation: portrait) { .pair { width: var(--S); height: calc(var(--S) * 1.53); } }

  .cover {
    position: absolute; left: 0; top: 0; width: var(--S); height: var(--S);
    border-radius: calc(var(--S) * .012);
    box-shadow: 0 calc(var(--S) * .05) calc(var(--S) * .12) rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
    overflow: hidden; z-index: 2;
    background: #2a1d14;
  }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; }
  .cover img.on { opacity: 1; }
  .cover::after {   /* a whisper of sheen so it reads as printed card, not a screenshot */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(125deg, rgb(255 255 255 / .10), transparent 35%, transparent 70%, rgb(0 0 0 / .12));
  }

  .disc-wrap {
    position: absolute; left: calc(var(--S) * .02); top: calc(var(--S) * .02);
    width: calc(var(--S) * .96); height: calc(var(--S) * .96);
    transform: translateX(calc(var(--out) * var(--S)));
    transition: transform 1.2s cubic-bezier(.22, .9, .25, 1);
    z-index: 1;
  }
  .pair.swap .disc-wrap { transition: transform .62s cubic-bezier(.55, 0, .8, .25); }
  @media (orientation: portrait) { .disc-wrap { transform: translateY(calc(var(--out) * var(--S))); } }

  .disc { position: absolute; inset: 0; border-radius: 50%; }
  .vinyl {        /* translucent coloured vinyl: static, so its blur never has to re-render */
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 33%, rgb(255 255 255 / .05) 33.4%, transparent 34%),
      repeating-radial-gradient(circle, rgb(255 255 255 / .045) 0 1px, transparent 1px 3.5px),
      radial-gradient(circle, color-mix(in srgb, var(--tint) 70%, transparent) 0 48%, color-mix(in srgb, var(--tint) 52%, rgb(0 0 0 / .4)) 100%);
    -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 calc(var(--S) * .04) calc(var(--S) * .1) rgb(0 0 0 / .35), inset 0 0 0 1px rgb(255 255 255 / .18), inset 0 0 calc(var(--S) * .03) rgb(0 0 0 / .25);
    transition: background-color 1s;
  }
  .spin { position: absolute; inset: 0; border-radius: 50%; will-change: transform; }
  .label {
    position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 1px rgb(0 0 0 / .25);
  }
  .label img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; }
  .label img.on { opacity: 1; }
  .swirl {        /* faint asymmetry in the vinyl so the turning reads beyond the label */
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgb(255 255 255 / .07), transparent 18%, transparent 46%, rgb(255 255 255 / .05) 58%, transparent 74%, rgb(255 255 255 / .07));
    -webkit-mask: radial-gradient(circle, transparent 0 34.5%, #000 35%); mask: radial-gradient(circle, transparent 0 34.5%, #000 35%);
  }
  .hole { position: absolute; left: 48.6%; top: 48.6%; width: 2.8%; height: 2.8%; border-radius: 50%; background: #120c08; box-shadow: inset 0 1px 2px rgb(0 0 0 / .6); }
  .sheen {        /* fixed light reflection: stays put while the disc turns */
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background:
      conic-gradient(from 0deg, transparent 0 290deg, rgb(255 236 210 / .22) 312deg, transparent 334deg),
      conic-gradient(from 0deg, transparent 0 110deg, rgb(255 236 210 / .12) 132deg, transparent 154deg);
    -webkit-mask: radial-gradient(circle, transparent 0 34.5%, #000 35%); mask: radial-gradient(circle, transparent 0 34.5%, #000 35%);
  }

  /* Text */
  .meta { width: calc(var(--S) * 1.53); transition: opacity .45s ease, transform .45s ease; }
  @media (orientation: portrait) { .meta { width: var(--S); } }
  .meta.out { opacity: 0; transform: translateY(6px); }
  .title { font-size: max(20px, 3.3vmin); font-weight: 600; letter-spacing: -.01em; line-height: 1.15;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .artist { margin-top: .45em; font-size: max(14px, 2.1vmin); color: rgb(255 244 230 / .62); }
  .bar { margin-top: max(14px, 2.2vmin); height: 2px; width: calc(var(--S) * .55); background: rgb(255 244 230 / .14); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: rgb(255 244 230 / .7); border-radius: 2px; }

  /* Controls */
  .controls {
    position: fixed; left: 50%; bottom: max(22px, 3.6vmin); transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px 10px; border-radius: 999px;
    background: rgb(20 12 6 / .35); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 1px rgb(255 240 220 / .08);
    transition: opacity .5s ease;
  }
  body.idle .controls { opacity: 0; pointer-events: none; transition-duration: 1.2s; }
  .controls button { width: max(38px, 4.6vmin); height: max(38px, 4.6vmin); border: 0; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .controls button:hover { background: rgb(255 240 220 / .1); }
  .controls svg { width: 46%; height: 46%; fill: currentColor; }
  .i-pause { display: none; } body:not(.paused) .i-pause { display: block; } body:not(.paused) .i-play { display: none; }
</style>
</head>
<body>
  <div class="bg"><div></div><div></div></div>
  <div class="glow"></div>
  <div class="grain"></div>

  <main class="stage">
    <div class="pair" id="pair">
      <div class="disc-wrap">
        <div class="disc">
          <div class="vinyl"></div>
          <div class="spin" id="spin">
            <div class="swirl"></div>
            <div class="label"><img alt=""><img alt=""></div>
          </div>
          <div class="sheen"></div>
          <div class="hole"></div>
        </div>
      </div>
      <div class="cover"><img alt=""><img alt=""></div>
    </div>
    <div class="meta" id="meta">
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </main>

  <nav class="controls">
    <button data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><rect x="5" y="5.5" width="2" height="13" rx="1"/><path d="M18.2 6.3v11.4a.9.9 0 0 1-1.4.75L9.3 12.75a.9.9 0 0 1 0-1.5l7.5-5.7a.9.9 0 0 1 1.4.75Z"/></svg></button>
    <button data-act="toggle" aria-label="Play/pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.1-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6Z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg></button>
    <button data-act="next" aria-label="Next"><svg viewBox="0 0 24 24"><rect x="17" y="5.5" width="2" height="13" rx="1"/><path d="M5.8 6.3v11.4a.9.9 0 0 0 1.4.75l7.5-5.7a.9.9 0 0 0 0-1.5l-7.5-5.7a.9.9 0 0 0-1.4.75Z"/></svg></button>
  </nav>

<script src="shared.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  const spin = DS.spinner($('#spin'));
  const pair = $('#pair'), meta = $('#meta');
  const setArt = DS.crossfader(
    [[...document.querySelectorAll('.cover img')], [...document.querySelectorAll('.label img')]],
    (el, t) => { el.src = t.url; });
  const setBg = DS.crossfader([[...document.querySelectorAll('.bg div')]], (el, t) => { el.style.backgroundImage = `url(${t.url})`; });

  function colours(p) {
    // Vinyl: the cover's most vivid colour, kept in a mid, glassy range. Grey covers get warm amber.
    let [h, s, l] = DS.rgbToHsl(p.colorful ? p.vibrant : [205, 140, 78]);
    root.style.setProperty('--tint', DS.css(DS.hslToRgb([h, DS.clamp(s, .4, .82), DS.clamp(l, .44, .6)])));
    root.style.setProperty('--wash', DS.css(p.dominant));
  }
  function apply(t) {
    setArt(t); setBg(t); colours(t.palette);
    $('#title').textContent = t.title; $('#artist').textContent = t.artist;
  }
  function setPlaying(on) { document.body.classList.toggle('paused', !on); spin.set(on); }

  DS.ready((t) => { apply(t); document.body.classList.toggle('paused', !DS.playing); spin.set(DS.playing, true); });
  DS.on('play', setPlaying);
  DS.on('track', (t) => {
    // Disc slides back into the sleeve, art changes, disc slides out again.
    pair.classList.add('swap'); meta.classList.add('out');
    setTimeout(() => { apply(t); meta.classList.remove('out'); }, 560);
    setTimeout(() => pair.classList.remove('swap'), 700);
  });
  (function tick() { $('#bar').style.width = (DS.progressNow() / DS.duration * 100) + '%'; setTimeout(tick, 500); })();
</script>
</body>
</html>
