<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster — dsvinyl draft</title>
<style>
  :root {
    --bg: rgb(226 112 64);
    --ink: rgb(20 16 12);
    --ink-soft: rgb(20 16 12 / .62);
    --D: 118vh;                                    /* disc diameter */
    --font: "Inter Display", "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
    transition: background-color 1.4s ease, color 1.4s ease;
  }
  body.idle { cursor: none; }
  /* soft paper tooth so the flat colour doesn't look like a bare div */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: multiply;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* evening light: a low warm gradient across the colour field */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgb(255 214 150 / .22), transparent 45%, rgb(40 20 0 / .14));
    transition: opacity 2s ease;
  }
  body.paused::after { opacity: .5; }

  /* Giant flat disc, bleeding off the right edge (bottom edge in portrait). */
  .disc {
    position: fixed; width: var(--D); height: var(--D);
    right: calc(var(--D) * -.3); top: calc(50% - var(--D) / 2);
    border-radius: 50%;
  }
  @media (orientation: portrait) {
    :root { --D: 122vw; }
    .disc { right: auto; left: calc(50% - var(--D) / 2); top: auto; bottom: calc(var(--D) * -.32); }
  }
  .vinyl {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 41%, #0b0b0b 41.2% 41.6%, transparent 41.8% 63%, #0b0b0b 63.2% 63.5%, transparent 63.7% 80%, #0b0b0b 80.2% 80.5%, transparent 80.7%),
      repeating-radial-gradient(circle, #191919 0 1px, #131313 1px 5px);
    box-shadow: 0 0 0 calc(var(--D) * .004) rgb(0 0 0 / .25);
  }
  .shine {          /* flat, hard-edged reflections: graphic, not photographic; they don't turn */
    position: absolute; inset: 0; border-radius: 50%;
    background:
      conic-gradient(from 0deg, transparent 0 296deg, rgb(255 255 255 / .055) 298deg 320deg, transparent 322deg),
      conic-gradient(from 0deg, transparent 0 116deg, rgb(255 255 255 / .035) 118deg 140deg, transparent 142deg);
    -webkit-mask: radial-gradient(circle, transparent 0 20.2%, #000 20.4%); mask: radial-gradient(circle, transparent 0 20.2%, #000 20.4%);
  }
  .spin { position: absolute; inset: 0; will-change: transform; }
  .label { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; overflow: hidden; }
  .label img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .8s ease; }
  .label img.on { opacity: 1; }
  .hole { position: absolute; left: 49.1%; top: 49.1%; width: 1.8%; height: 1.8%; border-radius: 50%; background: var(--bg); transition: background-color 1.4s ease; }

  /* Cover + type, set like a poster on the left (top in portrait). */
  .copy {
    position: fixed; left: 6.5vw; top: 50%; transform: translateY(-50%);
    width: min(50vh, 36vw);
    display: flex; flex-direction: column; gap: max(18px, 3.4vh);
  }
  @media (orientation: portrait) {
    .copy { left: 8vw; top: 6.5vh; transform: none; width: 84vw; flex-direction: column-reverse; gap: max(18px, 3vh); }
  }
  .cover { position: relative; width: min(50vh, 36vw); aspect-ratio: 1; overflow: hidden; box-shadow: 0 1.4vmin 3vmin rgb(0 0 0 / .18); }
  @media (orientation: portrait) { .cover { width: 50vw; } }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover img.on { z-index: 1; animation: wipe .9s cubic-bezier(.7, 0, .2, 1) both; }
  @keyframes wipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }

  .text { transition: opacity .4s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }
  .text.out { opacity: 0; transform: translateY(1.2vh); }
  .kicker { font: 600 max(11px, 1.35vmin)/1 var(--font); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); }
  .title {
    margin-top: .55em; font-size: max(30px, 5.6vmin); font-weight: 700; letter-spacing: -.035em; line-height: .98;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance;
  }
  .artist { margin-top: .5em; font-size: max(16px, 2.4vmin); font-weight: 500; color: var(--ink-soft); }
  @media (orientation: portrait) { .title { font-size: max(34px, 6.6vmin); max-width: 80vw; } }

  .controls {
    position: fixed; left: 6.5vw; bottom: max(20px, 4vh); display: flex; gap: 4px; margin-left: -10px;
    transition: opacity .5s ease;
  }
  @media (orientation: portrait) { .controls { left: auto; right: 6vw; top: 5vh; bottom: auto; } }
  body.idle .controls { opacity: 0; pointer-events: none; transition-duration: 1.2s; }
  .controls button { width: max(40px, 5vmin); height: max(40px, 5vmin); border: 0; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; transition: background .2s; }
  .controls button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .controls svg { width: 50%; height: 50%; fill: currentColor; }
  .i-pause { display: none; } body:not(.paused) .i-pause { display: block; } body:not(.paused) .i-play { display: none; }
</style>
</head>
<body>
  <div class="disc">
    <div class="vinyl"></div>
    <div class="spin" id="spin"><div class="label"><img alt=""><img alt=""></div></div>
    <div class="shine"></div>
    <div class="hole"></div>
  </div>

  <div class="copy">
    <div class="cover"><img alt=""><img alt=""></div>
    <div class="text" id="text">
      <div class="kicker">Now playing</div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
    </div>
  </div>

  <nav class="controls">
    <button data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><rect x="5" y="5.5" width="2" height="13" rx="1"/><path d="M18.2 6.3v11.4a.9.9 0 0 1-1.4.75L9.3 12.75a.9.9 0 0 1 0-1.5l7.5-5.7a.9.9 0 0 1 1.4.75Z"/></svg></button>
    <button data-act="toggle" aria-label="Play/pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.1-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6Z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg></button>
    <button data-act="next" aria-label="Next"><svg viewBox="0 0 24 24"><rect x="17" y="5.5" width="2" height="13" rx="1"/><path d="M5.8 6.3v11.4a.9.9 0 0 0 1.4.75l7.5-5.7a.9.9 0 0 0 0-1.5l-7.5-5.7a.9.9 0 0 0-1.4.75Z"/></svg></button>
  </nav>

<script src="shared.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  const spin = DS.spinner($('#spin'));
  const coverImgs = [...document.querySelectorAll('.cover img')];
  const setLabel = DS.crossfader([[...document.querySelectorAll('.label img')]], (el, t) => { el.src = t.url; });
  let front = 0;
  function setCover(t) {            // new cover wipes down over the old one
    const back = coverImgs[1 - front];
    back.src = t.url; back.classList.remove('on'); void back.offsetWidth; back.classList.add('on');
    coverImgs[front].classList.remove('on'); front = 1 - front;
  }

  // The field colour: the cover's dominant colour if it has character, else its most vivid one,
  // else a warm sand. Lightness is kept in a band where a black disc still pops.
  function field(p) {
    const [, ds] = DS.rgbToHsl(p.dominant);
    let base = ds > .07 ? p.dominant : p.colorful ? p.vibrant : (p.lum > .4 ? [222, 205, 176] : [70, 56, 46]);
    let [h, s, l] = DS.rgbToHsl(base);
    s = Math.min(s, .62);
    l = DS.clamp(l, .3, .8);
    // Keep the cover from melting into the field: nudge the field away from the cover's brightness.
    if (Math.abs(DS.lum(DS.hslToRgb([h, s, l])) - p.lum) < .12) l = l > .55 ? l - .16 : l + .14;
    const bg = DS.hslToRgb([h, s, l]);
    const dark = DS.lum(bg) < .28;
    root.style.setProperty('--bg', DS.css(bg));
    root.style.setProperty('--ink', dark ? 'rgb(252 247 238)' : 'rgb(20 16 12)');
    root.style.setProperty('--ink-soft', dark ? 'rgb(252 247 238 / .66)' : 'rgb(20 16 12 / .6)');
  }
  function apply(t, first) {
    if (first) { coverImgs[0].src = t.url; coverImgs[0].classList.add('on'); } else setCover(t);
    setLabel(t); field(t.palette);
    if (first) { $('#title').textContent = t.title; $('#artist').textContent = t.artist; }
  }

  DS.ready((t) => { apply(t, true); document.body.classList.toggle('paused', !DS.playing); spin.set(DS.playing, true); });
  DS.on('play', (on) => { document.body.classList.toggle('paused', !on); spin.set(on); });
  DS.on('track', (t) => {
    $('#text').classList.add('out');
    apply(t);
    setTimeout(() => { $('#title').textContent = t.title; $('#artist').textContent = t.artist; $('#text').classList.remove('out'); }, 420);
  });
</script>
</body>
</html>
