<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — dsvinyl draft</title>
<style>
  :root {
    --D: min(90vh, 64vw);                   /* disc diameter */
    --halo: rgb(255 170 90);
    --ink: rgb(250 241 228);
    --font: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  @media (orientation: portrait) { :root { --D: min(92vw, 64vh); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0908; color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body.idle { cursor: none; }

  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  @media (orientation: portrait) { .stage { place-items: start center; padding-top: calc(50vh - var(--D) * .62); } }

  .orbit { position: relative; width: var(--D); height: var(--D); }

  /* A warm halo behind the disc, tinted by the cover. */
  .halo {
    position: absolute; inset: -32%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, color-mix(in srgb, var(--halo) 30%, transparent) 0 52%, color-mix(in srgb, var(--halo) 11%, transparent) 66%, color-mix(in srgb, var(--halo) 3%, transparent) 82%, transparent 100%);
    transition: opacity 2.4s ease, background 1.6s ease;
  }
  body.paused .halo { opacity: .45; }

  .disc { position: absolute; inset: 0; border-radius: 50%; }
  .vinyl {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 85.5%, rgb(255 255 255 / .05) 86%, transparent 86.6% 93.6%, rgb(255 255 255 / .05) 94%, transparent 94.6%),
      repeating-radial-gradient(circle, #181514 0 1px, #0f0d0c 1px 4px);
    box-shadow: 0 0 0 1px rgb(255 255 255 / .05), 0 3vmin 8vmin rgb(0 0 0 / .6);
  }
  .spin { position: absolute; inset: 0; will-change: transform; }
  .spin svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .rim { font: 600 22px var(--font); letter-spacing: 0; fill: rgb(250 241 228 / .62); text-transform: uppercase; transition: opacity .6s ease; }
  .rim.out { opacity: 0; }
  .sheen {      /* fixed, soft reflection */
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background:
      conic-gradient(from 0deg, transparent 0 292deg, color-mix(in srgb, var(--halo) 18%, rgb(255 255 255 / .06)) 315deg, transparent 338deg),
      conic-gradient(from 0deg, transparent 0 112deg, rgb(255 255 255 / .05) 135deg, transparent 158deg);
  }

  .cover {
    position: absolute; left: 50%; top: 50%; width: calc(var(--D) * .58); height: calc(var(--D) * .58);
    transform: translate(-50%, -50%);
    box-shadow: 0 2.2vmin 5vmin rgb(0 0 0 / .55), 0 0 0 1px rgb(255 255 255 / .06);
    background: #1a1614; overflow: hidden;
    transition: transform 1.2s cubic-bezier(.2, .8, .2, 1);
  }
  body.paused .cover { transform: translate(-50%, -50%) scale(.985); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.1s ease; }
  .cover img.on { opacity: 1; }

  .meta {
    position: fixed; left: max(28px, 4.5vmin); bottom: max(28px, 4.5vmin); max-width: calc((100vw - var(--D)) / 2 + 6vw);
    transition: opacity .5s ease;
  }
  @media (orientation: portrait) {
    .meta { left: 50%; transform: translateX(-50%); bottom: auto; top: calc(50vh + var(--D) * .48); text-align: center; max-width: 84vw; width: 84vw; }
  }
  .meta.out { opacity: 0; }
  .title { font-size: max(18px, 2.7vmin); font-weight: 600; letter-spacing: -.005em; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .artist { margin-top: .4em; font-size: max(14px, 1.9vmin); color: rgb(250 241 228 / .55); }

  .controls {
    position: fixed; right: max(24px, 4vmin); bottom: max(24px, 4vmin); display: flex; gap: 4px;
    transition: opacity .5s ease;
  }
  @media (orientation: portrait) { .controls { right: 50%; transform: translateX(50%); } }
  body.idle .controls { opacity: 0; pointer-events: none; transition-duration: 1.2s; }
  .controls button { width: max(40px, 4.8vmin); height: max(40px, 4.8vmin); border: 0; border-radius: 50%; background: rgb(255 255 255 / .05); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .controls button:hover { background: rgb(255 255 255 / .11); }
  .controls svg { width: 44%; height: 44%; fill: currentColor; }
  .i-pause { display: none; } body:not(.paused) .i-pause { display: block; } body:not(.paused) .i-play { display: none; }
</style>
</head>
<body>
  <main class="stage">
    <div class="orbit">
      <div class="halo"></div>
      <div class="disc">
        <div class="vinyl"></div>
        <div class="spin" id="spin">
          <svg viewBox="0 0 1000 1000" aria-hidden="true">
            <defs><path id="rimPath" d="M500,500 m-450,0 a450,450 0 1,1 900,0 a450,450 0 1,1 -900,0"/></defs>
            <text class="rim" id="rim"><textPath href="#rimPath" id="rimText" lengthAdjust="spacing"></textPath></text>
          </svg>
        </div>
        <div class="sheen"></div>
      </div>
      <div class="cover"><img alt=""><img alt=""></div>
    </div>
  </main>

  <div class="meta" id="meta"><div class="title" id="title"></div><div class="artist" id="artist"></div></div>

  <nav class="controls">
    <button data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><rect x="5" y="5.5" width="2" height="13" rx="1"/><path d="M18.2 6.3v11.4a.9.9 0 0 1-1.4.75L9.3 12.75a.9.9 0 0 1 0-1.5l7.5-5.7a.9.9 0 0 1 1.4.75Z"/></svg></button>
    <button data-act="toggle" aria-label="Play/pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.1-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6Z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg></button>
    <button data-act="next" aria-label="Next"><svg viewBox="0 0 24 24"><rect x="17" y="5.5" width="2" height="13" rx="1"/><path d="M5.8 6.3v11.4a.9.9 0 0 0 1.4.75l7.5-5.7a.9.9 0 0 0 0-1.5l-7.5-5.7a.9.9 0 0 0-1.4.75Z"/></svg></button>
  </nav>

<script src="shared.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  // Slow and calm: the title has to stay readable as it travels round.
  const spin = DS.spinner($('#spin'), { rpm: 2.5, up: 2200, down: 2600 });
  const setArt = DS.crossfader([[...document.querySelectorAll('.cover img')]], (el, t) => { el.src = t.url; });
  const CIRC = 2 * Math.PI * 450;

  function setRim(t) {
    const tp = $('#rimText');
    const unit = `${t.title}   ·   ${t.artist}   ·   `;
    tp.textContent = unit; tp.removeAttribute('textLength');
    const len = tp.getComputedTextLength() || 1;
    const n = Math.max(1, Math.round(CIRC / len));
    tp.textContent = unit.repeat(n);
    tp.setAttribute('textLength', String(CIRC - 4));
    $('#rim').style.fontSize = len > CIRC ? `${22 * CIRC / len * .96}px` : '';
  }
  function halo(p) {
    let [h, s] = DS.rgbToHsl(p.colorful ? p.vibrant : [255, 170, 90]);
    // lean every halo a little toward amber, so it always reads as warm light
    const c = DS.mix(DS.hslToRgb([h, DS.clamp(s, .45, .9), .58]), [255, 170, 90], .35);
    root.style.setProperty('--halo', DS.css(c));
  }
  function text(t) { $('#title').textContent = t.title; $('#artist').textContent = t.artist; }

  DS.ready((t) => { setArt(t); setRim(t); halo(t.palette); text(t); document.body.classList.toggle('paused', !DS.playing); spin.set(DS.playing, true); });
  DS.on('play', (on) => { document.body.classList.toggle('paused', !on); spin.set(on); });
  DS.on('track', (t) => {
    $('#rim').classList.add('out'); $('#meta').classList.add('out');
    setArt(t); halo(t.palette);
    setTimeout(() => { setRim(t); text(t); $('#rim').classList.remove('out'); $('#meta').classList.remove('out'); }, 600);
  });
</script>
</body>
</html>
