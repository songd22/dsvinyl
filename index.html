<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120c08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>dsvinyl</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23d68c46'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23120c08'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cursor-idle">
  <!-- Background: a slow-drifting gradient built from the album's palette, under a golden glow. -->
  <div class="mesh" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>
  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage drift" aria-label="Now playing">
    <div class="pair" id="pair">
      <div class="disc-wrap">
        <div class="disc" id="disc" title="Play / pause">
          <div class="vinyl"></div>
          <div class="spin" id="spin">
            <div class="swirl"></div>
            <div class="label"><div class="blank"></div><img alt="" draggable="false"><img alt="" draggable="false"></div>
          </div>
          <div class="sheen"></div>
          <div class="hole"></div>
        </div>
      </div>
      <div class="cover" id="cover" title="Play / pause">
        <div class="blank"></div><img alt="" draggable="false"><img alt="" draggable="false">
      </div>
    </div>
    <div class="meta" id="meta" aria-live="polite">
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="progress"><i id="progress"></i></div>
    </div>
  </main>

  <!-- Clock: small in the corner while music plays; large and centred when nothing is playing. -->
  <div class="clock corner drift" aria-hidden="true"><div class="time"></div><div class="date"></div></div>
  <div class="clock focus drift"><div class="time"></div><div class="date"></div></div>

  <div class="dimmer" aria-hidden="true"></div>
  <div class="warmth" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <nav class="controls" id="controls" aria-label="Playback">
    <button type="button" data-action="previous" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5.5" width="2" height="13" rx="1"/><path d="M18.2 6.3v11.4a.9.9 0 0 1-1.4.75L9.3 12.75a.9.9 0 0 1 0-1.5l7.5-5.7a.9.9 0 0 1 1.4.75Z"/></svg>
    </button>
    <button type="button" data-action="toggle" id="toggleBtn" aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.1-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
    </button>
    <button type="button" data-action="next" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="17" y="5.5" width="2" height="13" rx="1"/><path d="M5.8 6.3v11.4a.9.9 0 0 0 1.4.75l7.5-5.7a.9.9 0 0 0 0-1.5l-7.5-5.7a.9.9 0 0 0-1.4.75Z"/></svg>
    </button>
  </nav>

  <!-- One-time setup (only when no Client ID is saved). -->
  <section class="setup" id="setup" hidden aria-labelledby="setupTitle">
    <h1 id="setupTitle">Set up dsvinyl</h1>
    <p class="lede">A one-time link to your Spotify account. It takes about a minute.</p>
    <ol>
      <li>
        <span>Open the <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">Spotify Developer Dashboard</a> and create an app. Tick <em>Web API</em>.</span>
      </li>
      <li>
        <span>Add this exact Redirect URI to the app:</span>
        <div class="uri"><code id="redirectUri"></code><button type="button" id="copyUri">Copy</button></div>
      </li>
      <li>
        <span>Paste the app's Client ID here:</span>
        <form class="cid" id="cidForm" autocomplete="off">
          <input id="cidInput" type="text" inputmode="latin" spellcheck="false" placeholder="Client ID" aria-label="Client ID">
          <button type="submit">Save</button>
        </form>
        <div class="hint" id="cidHint">You only need the Client ID. No secret.</div>
      </li>
    </ol>
  </section>

  <div class="connect" id="connect" hidden>
    <button type="button" class="connect-btn" id="connectBtn">Connect Spotify</button>
    <button type="button" class="connect-alt" id="changeCid">Use a different Client ID</button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
